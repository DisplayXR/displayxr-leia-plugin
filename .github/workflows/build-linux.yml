# Linux CI for the Leia plug-in's Track A arm (src/drv_leia_linux, stub weaver).
#
# Tri-LTS coverage: the contract's launch target is Ubuntu 26.04 (GCC 15),
# the interim dev box is 22.04, and 24.04 is what the runtime's own Linux CI
# runs on — so all three build in containers and all three are required.
#
# What each leg proves:
#   1. DisplayXR-LeiaSR.so builds against the pinned runtime (ABI headers +
#      static aux) on that LTS toolchain.
#   2. Single-export discipline: the .so exports exactly xrtPluginNegotiate
#      (nm twin of build-windows.yml's dumpbin assertion, ADR-019 / #496).
#   3. Discovery + ABI gate + display info: displayxr-cli selftest goes green
#      with the leia-sr plug-in active (JSON-manifest discovery via
#      XRT_PLUGIN_SEARCH_PATH; the loader rejects ABI-mismatched plug-ins, so
#      a green selftest IS the ABI check).
#   4. Probe default-decline: without DXR_LEIA_FORCE_PROBE=1 the plug-in
#      declines and selftest fails (no active DP) — the stub must never
#      hijack a machine it wasn't forced onto.
#
# Triggers: pull_request + manual dispatch, plus v* release tags (for the Deb
# job's release-asset attach) — never plain pushes to main. No versions-bump
# dispatch here — that stays tag-driven in build-windows.yml.
#
# Packaging jobs (runtime #781 Phase 3; portability fix mirrors the runtime's
# #1656 / PR #1659). ONE .deb must install AND run on Ubuntu 22.04, 24.04 and
# 26.04, so both packaging jobs build in an ubuntu:22.04 container — a
# package's glibc floor is its build host's:
#   DebStub     Track A (--stub) package. No vendor SDK needed, so it runs on
#               every PR and is what makes the packaging itself verifiable.
#   Deb         Track B (real srSDK) package — the shipped artifact. Soft-skips
#               until the Linux SDK asset is uploaded to the sr-sdk-v* release
#               (see @George), so it never blocks a PR.
#   DebInstall  installs the package(s) into pristine 22.04 / 24.04 / 26.04
#               containers alongside the released runtime .deb and runs them.
#   DebRelease  attaches the Track B .deb to a v* Release, gated on DebInstall.
#   Linux Packaging  aggregator over DebStub + Deb + DebInstall: the single
#               stable required context for the packaging lane (the DebInstall
#               matrix names move when the release list changes), so a .deb
#               that installs but cannot run blocks the merge, not just the
#               release (runtime #1656 / #1684).
#
# Doc-only short-circuit: DetectChanges classifies the change; every job still
# RUNS (so required contexts always report) but skips its steps on a doc-only
# PR, the same pattern as the runtime's build-linux.yml.

name: Build Linux

on:
  pull_request:
  workflow_dispatch:
  # Release tags: the Deb job attaches displayxr-leia-sr_<ver>_amd64.deb to the
  # GitHub Release (the Linux meta-bundle fetches it — runtime #781 Phase 3).
  # Tags only, never plain pushes to main.
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the Deb job attaches release assets on tags

env:
  # Runtime ref the Linux arm builds against. MUST equal the CMake
  # DXR_RUNTIME_GIT_TAG_LINUX default (rule-5 self-check below, same policy
  # as build-windows.yml's RUNTIME_REF check). Floor v2.14.6 (the #1243
  # vk_bundle ABI fingerprint fields; no feature macro, an older ref fails to
  # compile). v2.17.1: first line with the rear-depth-budget preview
  # (XRT_DP_VK_HAS_BACKGROUND_PREVIEW), and a vk_bundle layout that matches
  # runtimes v2.16.0..main — see the CMakeLists comment.
  RUNTIME_REF: v2.21.1

jobs:
  # Classify the change. Same rule as displayxr-runtime's build-linux.yml:
  # every heavy job still RUNS (so it reports its status) but gates each step
  # on docs_only, so a doc-only PR goes green in seconds without building.
  # Non-PR triggers (workflow_dispatch, v* tags) always build.
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full clone — the diff below uses pull_request.base.sha, which can
          # be older than the merge commit's first parent.
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Detected non-PR trigger — docs_only=false"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  Build:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      # Bare container, running as root (no sudo). git + ca-certificates must
      # land BEFORE actions/checkout, or it silently falls back to the tarball
      # API and `git describe` (the plug-in's iface .version, #47) degrades.
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates jq \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev \
            libpipewire-0.3-dev libdbus-1-dev
          # ^ pipewire + dbus: compile-check the mutter/PipeWire desktop-capture
          #   producer (runtime#757, behind DXR_LEIA_HAVE_PIPEWIRE). CI cannot
          #   RUN a mutter/PipeWire session (no compositor), but with the -dev libs
          #   present CMake defines DXR_LEIA_HAVE_PIPEWIRE so the real body is
          #   compiled — otherwise this large producer only ever built on the box.

      - name: Checkout plug-in
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git describe

      # Rule-5 (ADR-020): the CMake Linux pin and this workflow's runtime
      # checkout must be the same ref, or the plug-in builds against
      # different ABI headers than CI validates.
      - name: Rule-5 Linux pin self-check
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          tag=$(grep -oP 'set\(DXR_RUNTIME_GIT_TAG_LINUX\s+"\K[^"]+' CMakeLists.txt | head -1)
          if [ "$tag" != "$RUNTIME_REF" ]; then
            echo "::error::Linux runtime pin drift: CMakeLists.txt has '$tag', workflow has '$RUNTIME_REF'"
            exit 1
          fi
          echo "Pin OK: $tag"

      - name: Checkout runtime @ ${{ env.RUNTIME_REF }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
          fetch-depth: 1

      - name: Configure
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDXR_RUNTIME_SOURCE_DIR="$GITHUB_WORKSPACE/displayxr-runtime"

      - name: Build plug-in
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build build

      # displayxr-cli is a runtime target inside the same build tree
      # (EXCLUDE_FROM_ALL only skips it from the default target).
      - name: Build displayxr-cli
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build build --target cli

      - name: Unit test — lens-preference ownership (LeiaSR #266)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./build/src/drv_leia_linux/test_lens_owner_linux

      - name: Unit test — stereo camera source parsing (runtime ADR-043, L1)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./build/src/drv_leia_linux/test_stereo_camera_parse

      - name: Assert single export (ADR-019 / #496)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          SO=build/src/drv_leia_linux/DisplayXR-LeiaSR.so
          test -f "$SO" || { echo "::error::$SO not built"; exit 1; }
          syms=$(nm -D --defined-only "$SO" | awk '{print $NF}')
          if [ "$syms" != "xrtPluginNegotiate" ]; then
            echo "::error::unexpected exports from $SO:"
            nm -D --defined-only "$SO"
            exit 1
          fi

      - name: Assert no unresolved symbols
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          # The export check above says what the .so PROVIDES; this says whether it
          # can LOAD at all. On Linux a shared library links successfully with
          # dangling references and only dies when the loader binds them, so a green
          # build proves nothing about loadability — the runtime would dlopen this
          # plug-in and fail with `undefined symbol: <x>` on the target box.
          # displayxr-unity#249 shipped exactly that. The link also passes
          # -Wl,--no-undefined; keep both, because that flag is easy to drop in a
          # refactor and this is the symptom a user actually hits.
          SO=build/src/drv_leia_linux/DisplayXR-LeiaSR.so
          if ldd -r "$SO" 2>&1 | grep -q 'undefined symbol'; then
            echo "::error::unresolved symbols in $SO — the runtime will fail to dlopen it:"
            ldd -r "$SO" 2>&1 | grep 'undefined symbol' | sort -u
            exit 1
          fi
          echo "no unresolved symbols: OK"
          echo "OK: only xrtPluginNegotiate exported"

      - name: Selftest (discovery + ABI + display info)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          CLI=$(find build/runtime-build/src/xrt/targets/cli -maxdepth 1 -name displayxr-cli -type f | head -1)
          test -n "$CLI" || { echo "::error::displayxr-cli not found"; exit 1; }

          mkdir -p build/_plugins
          cp build/src/drv_leia_linux/DisplayXR-LeiaSR.so build/_plugins/
          cat > build/_plugins/050-leia-sr.json <<EOF
          {
              "file_format_version": "1.0",
              "plugin": {
                  "id":           "leia-sr",
                  "display_name": "DisplayXR Leia SR (Linux, stub weaver)",
                  "vendor":       "Leia Inc.",
                  "version":      "ci",
                  "binary_path":  "$PWD/build/_plugins/DisplayXR-LeiaSR.so",
                  "probe_order":  50
              }
          }
          EOF
          export XRT_PLUGIN_SEARCH_PATH="$PWD/build/_plugins"

          echo "--- default-decline sanity: probe must decline without the env gate"
          if "$CLI" selftest; then
            echo "::error::selftest passed WITHOUT DXR_LEIA_FORCE_PROBE=1 — the stub probe must decline by default"
            exit 1
          fi
          echo "OK: declined by default"

          echo "--- forced probe: full selftest"
          DXR_LEIA_FORCE_PROBE=1 "$CLI" selftest --json | tee selftest.json

          echo "--- assert the active plug-in is leia-sr"
          # selftest --json emits a checks[] array; the plugin identity object
          # lives in `info --json` — assert on both.
          jq -e '.checks[] | select(.name=="active_plugin") | .ok' selftest.json > /dev/null
          DXR_LEIA_FORCE_PROBE=1 "$CLI" info --json > info.json
          jq -e '.plugin.id == "leia-sr"' info.json > /dev/null
          echo "OK: leia-sr active, ABI green"


  # ---------------------------------------------------------------------------
  # PACKAGING (leia-plugin: one .deb for Ubuntu 22.04, 24.04 and 26.04)
  #
  # v2.7.0 installed on 24.04 only: it was built on the 24.04 runner, so it
  # needed GLIBC_2.38 / GLIBCXX_3.4.31 behind an UNVERSIONED `libc6`, and it
  # named `libpipewire-0.3-0t64`, a package that does not exist on jammy.
  # Mirrors the runtime's fix (displayxr-runtime #1656 / PR #1659): build the
  # package on the OLDEST supported release, derive VERSIONED Depends with
  # dpkg-shlibdeps, and prove the result by installing it into a pristine
  # container of every supported release.
  #
  # Two packaging jobs, because only one of them can run without the vendor SDK:
  #   DebStub  — Track A (stub weaver), ubuntu:22.04 container. No SDK needed,
  #              so it runs on EVERY PR and is what makes the packaging itself
  #              CI-verifiable. Its .so links the same system libraries as the
  #              real one (vulkan, cjson, xcb, xcb-randr, pipewire, dbus), so
  #              the derived Depends line is representative.
  #   Deb      — Track B (real srSDK), the shipped artifact. Soft-skips when the
  #              SDK asset or token is absent, so it never blocks a PR.
  # DebInstall verifies the Track A package on all three releases, and the
  # Track B package too whenever that one was actually built.
  # ---------------------------------------------------------------------------

  # Track A packaging: build the stub-weaver .deb in the OLDEST supported
  # release's container (glibc 2.35 / GCC 11 floor) and let
  # package_deb_leia.sh's guards run for real — versioned Depends,
  # STABLE_SONAMES, and DXR_DEB_MAX_GLIBC refusing a floor above 22.04's.
  # NOT a shippable artifact (the stub does no weaving); this proves PACKAGING.
  # 22.04's apt cmake is 3.22.1 = CMakeLists' floor, so no pinned CMake — the
  # repo's real floor is exercised.
  DebStub:
    name: DebStub (Track A packaging, ubuntu:22.04)
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DXR_DEB_MAX_GLIBC: "2.35" # Ubuntu 22.04 — the oldest supported release
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — skipping the Track A .deb build."

      # Bare image, root: git BEFORE checkout, else it falls back to a tarball
      # with no tags and `git describe` cannot version the .deb.
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates jq \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev \
            libxrandr-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            dpkg-dev fakeroot patchelf binutils
          cmake --version | head -1

      - name: Checkout plug-in
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the .deb version

      - name: Checkout runtime @ ${{ env.RUNTIME_REF }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
          fetch-depth: 1

      - name: Build + package the Track A (stub) .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          DXR_RUNTIME_SOURCE_DIR: ${{ github.workspace }}/displayxr-runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/package_deb_leia.sh --stub
          ls -lh dist/displayxr-leia-sr_*_amd64.deb

      - name: Upload stub .deb artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: displayxr-leia-sr-stub-deb
          path: dist/displayxr-leia-sr_*_amd64.deb
          if-no-files-found: error

  # Track B (real srSDK) .deb for the Linux meta-bundle (runtime #781 Phase 3).
  # Builds the REAL plug-in .deb using the Linux SR SDK pulled from the
  # sr-sdk-v* release — the same release the Windows build pulls the win64 SDK
  # from — and on a v* tag attaches displayxr-leia-sr_<ver>_amd64.deb to the
  # GitHub Release. Single artifact on one base (not the tri-LTS matrix).
  #
  # Built in the ubuntu:22.04 container for the same reason as DebStub: the
  # shipped package's glibc floor is its build host's. `base` is published as a
  # job output so DebInstall knows which releases this artifact can even claim
  # to install on.
  #
  # GATED ON THE LINUX SDK ASSET EXISTING: until a LeiaSR-SDK-<SR_TAG>-linux64.*
  # is uploaded to the sr-sdk-v<SR_TAG> release on SR_SDK_REPO (produced by the LeiaSR Linux
  # build — see runtime #781 / @George), the download soft-skips and this job is
  # a green no-op. It never blocks a PR.
  Deb:
    name: Deb (Track B, ubuntu:22.04)
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    outputs:
      have_sdk: ${{ steps.sdk.outputs.have_sdk }}
      base: ${{ steps.base.outputs.base }}
    env:
      DXR_DEB_MAX_GLIBC: "2.35" # Ubuntu 22.04 — the oldest supported release
      # Linux srSDK release tag. Independent of build-windows.yml's SR_TAG — the
      # Linux srSDK is versioned like the SR runtime (1.37.0.x) and lives in its
      # own sr-sdk-v<SR_TAG> release with the LeiaSR-SDK-<SR_TAG>-linux64.* asset.
      #
      # MUST ship srWeaverSnapToPhase + srWeaverSetPresentOrigin (LeiaSR#85) in
      # its sr/sr_weaver.h + libsrSDK_loader.a (#271): v2.7.3 was built against
      # 1.37.0.41935, which predates the snap call, and shipped a plug-in whose
      # window drags never phase-snap. The build now REFUSES such an SDK
      # (CMake FATAL_ERROR + the symbol check below). Build numbers are not
      # ordered across SR branches — 41935 is older than 10693 in API terms —
      # so check the header, not the number, when moving this pin.
      SR_TAG: 1.37.0.10693
      # Private Leia artifact repo hosting every sr-sdk-v* release (see
      # build-windows.yml). Read with LEIALOFT_GITHUB_TOKEN.
      SR_SDK_REPO: LeiaInc/SR-SDK-Windows-Releases-Internal-Public
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — skipping the Track B .deb build."

      # Bare image, root, no sudo. gh is not in jammy's archive and this job
      # needs it to pull the SDK asset, so add the upstream apt repo.
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl gnupg unzip xz-utils jq \
            build-essential cmake ninja-build pkg-config glslang-tools \
            libvulkan-dev libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev \
            libxrandr-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            dpkg-dev fakeroot patchelf binutils
          # ^ pipewire + dbus: the shipped .deb must carry the portal/PipeWire
          #   desktop-capture producer (compose-under-bg live background,
          #   runtime#757) — v2.0.4 shipped without it because only the
          #   compile-check job had these. package_deb_leia.sh refuses a .deb
          #   without them, and dpkg-shlibdeps turns them into versioned Depends.
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
          cmake --version | head -1
          gh --version | head -1

      - name: Record the build base
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: base
        run: |
          . /etc/os-release
          echo "base=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Track B .deb is built on $PRETTY_NAME"

      - name: Checkout plug-in
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the .deb version

      - name: Checkout runtime @ ${{ env.RUNTIME_REF }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
          fetch-depth: 1

      - name: Download the Linux SR SDK from the sr-sdk release
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.LEIALOFT_GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::LEIALOFT_GITHUB_TOKEN absent (fork PR?) — the Linux SR SDK lives on the private $SR_SDK_REPO release; skipping the Track B .deb."
            echo "have_sdk=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Try common tarball extensions; the LeiaSR Linux build decides the
          # exact name. Absent asset => soft-skip (the .deb path isn't live yet).
          got=""
          for ext in tar.gz tgz tar.xz zip; do
            if gh release download "sr-sdk-v$SR_TAG" -R "$SR_SDK_REPO" \
                 -p "LeiaSR-SDK-$SR_TAG-linux64.$ext" -D . 2>/dev/null; then
              got="LeiaSR-SDK-$SR_TAG-linux64.$ext"; break
            fi
          done
          if [ -z "$got" ]; then
            # A v* release tag with no SDK would publish a release with no
            # Linux .deb at all (DebRelease just skips) — refuse that loudly.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::No LeiaSR-SDK-$SR_TAG-linux64.* on the $SR_SDK_REPO sr-sdk-v$SR_TAG release — a release tag cannot ship without the Track B .deb."
                exit 1 ;;
            esac
            echo "::warning::No LeiaSR-SDK-$SR_TAG-linux64.* on the $SR_SDK_REPO sr-sdk-v$SR_TAG release — skipping the Track B .deb. Upload the Linux SDK to that release to enable it (runtime #781)."
            echo "have_sdk=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p _srsdk
          case "$got" in
            *.zip) unzip -q "$got" -d _srsdk ;;
            *)     tar -xf "$got" -C _srsdk ;;
          esac
          # SRSDK_ROOT = the prefix that holds lib/cmake/srSDK/ (what
          # find_package(srSDK CONFIG) searches). Derive it from the config file
          # so the tarball's top-dir name doesn't matter.
          cfg=$(find _srsdk \( -name 'srSDKConfig.cmake' -o -name 'srSDK-config.cmake' \) | head -1)
          if [ -z "$cfg" ]; then
            echo "::error::LeiaSR Linux SDK unpacked but no srSDK CMake config found — check the tarball layout."
            exit 1
          fi
          # PREFIX (holds lib/cmake/srSDK/) = 3 levels up from the config's dir:
          # srSDK -> cmake -> lib -> PREFIX. find_package(srSDK CONFIG) then
          # resolves <PREFIX>/lib/cmake/srSDK. (Two levels landed on .../lib and
          # find_package missed it.)
          root=$(cd "$(dirname "$cfg")/../../.." && pwd)
          echo "SRSDK_ROOT=$root" >> "$GITHUB_ENV"
          echo "have_sdk=yes" >> "$GITHUB_OUTPUT"
          echo "SRSDK_ROOT=$root"

      - name: Build Track B .deb
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.sdk.outputs.have_sdk == 'yes'
        env:
          DXR_RUNTIME_SOURCE_DIR: ${{ github.workspace }}/displayxr-runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/package_deb_leia.sh
          ls -lh dist/displayxr-leia-sr_*_amd64.deb

      # Release check (#271): the SHIPPED .so must carry srWeaverSnapToPhase.
      # v2.7.3's .deb had zero occurrences — the SDK pin predated the call and
      # the build compiled a silent identity stub, so window drags never
      # phase-snapped. CMake and package_deb_leia.sh both refuse that now; this
      # inspects the artifact itself, after packaging, because the artifact is
      # what users get. Opt-out: set DXR_LEIA_LNX_ALLOW_NO_SNAP=ON on the job
      # (and pass --allow-no-snap above) — never for a release.
      - name: Assert drag phase-snap in the shipped .so (#271)
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.sdk.outputs.have_sdk == 'yes'
        run: |
          deb=$(ls dist/displayxr-leia-sr_*_amd64.deb | head -1)
          rm -rf _debx && dpkg-deb -x "$deb" _debx
          SO=_debx/usr/lib/displayxr/plugins/DisplayXR-LeiaSR.so
          test -f "$SO" || { echo "::error::$SO missing from $deb"; exit 1; }
          hits=$(strings "$SO" | grep -c srWeaverSnapToPhase || true)
          echo "srWeaverSnapToPhase string hits in $SO: $hits"
          if [ "$hits" -gt 0 ]; then
            echo "OK: drag phase-snap compiled in"
          elif [ "${DXR_LEIA_LNX_ALLOW_NO_SNAP:-OFF}" = "ON" ]; then
            echo "::warning::srWeaverSnapToPhase absent from $SO (DXR_LEIA_LNX_ALLOW_NO_SNAP=ON) — window drags will NOT phase-snap. Not releasable."
          else
            echo "::error::srWeaverSnapToPhase absent from the shipped $SO — window drags would never phase-snap (#271). Move SR_TAG to a Linux SDK that ships it."
            exit 1
          fi

      - name: Upload .deb artifact
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.sdk.outputs.have_sdk == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: displayxr-leia-sr-deb
          path: dist/displayxr-leia-sr_*_amd64.deb
          if-no-files-found: error

  # Install the packaged plug-in into a PRISTINE container of every supported
  # release, alongside the latest RELEASED runtime .deb (the plug-in
  # hard-Depends on displayxr-runtime), and check it there
  # (scripts/verify_deb_install_linux.sh): apt must resolve Depends from that
  # release's archive with --no-install-recommends, every
  # Depends/Recommends/Suggests name must exist there, `ldd -r` must be clean on
  # the installed .so, and `displayxr-cli selftest` must pass env-free with the
  # plug-in installed (its probe declines with no vendor SR runtime present, so
  # sim-display claims — the graceful-fallback contract).
  #
  # The Track A (stub) package is always verified; the Track B package is
  # verified too whenever it was built, on every release at or above its build
  # base. A 24.04-built Track B package therefore does NOT get a 22.04 leg —
  # that gap is reported, not hidden.
  DebInstall:
    name: DebInstall (Ubuntu ${{ matrix.release }})
    needs: [DetectChanges, DebStub, Deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["22.04", "24.04", "26.04"]
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — no .deb to verify."

      - uses: actions/checkout@v4
        if: needs.DetectChanges.outputs.docs_only != 'true'

      - name: Download the Track A (stub) .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: displayxr-leia-sr-stub-deb
          path: stub-deb

      - name: Download the Track B .deb
        if: needs.DetectChanges.outputs.docs_only != 'true' && needs.Deb.outputs.have_sdk == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: displayxr-leia-sr-deb
          path: trackb-deb

      - name: Fetch the latest released runtime .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo DisplayXR/displayxr-runtime \
            --pattern 'displayxr-runtime_*_amd64.deb' --dir runtime-deb
          ls -lh runtime-deb

      - name: Track A — apt install + ldd -r + selftest in clean ubuntu:${{ matrix.release }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.release }}" \
            ./scripts/verify_deb_install_linux.sh stub-deb/*.deb runtime-deb/*.deb

      - name: Track B — apt install + ldd -r + selftest in clean ubuntu:${{ matrix.release }}
        if: needs.DetectChanges.outputs.docs_only != 'true' && needs.Deb.outputs.have_sdk == 'yes'
        env:
          BASE: ${{ needs.Deb.outputs.base }}
          RELEASE: ${{ matrix.release }}
        run: |
          # A package cannot install below the release it was built on, so only
          # verify from the build base upwards. If BASE is not 22.04, the gap is
          # the thing to fix — say so loudly rather than passing silently.
          oldest="$(printf '%s\n%s\n' "$BASE" "$RELEASE" | sort -V | head -1)"
          if [ "$oldest" = "$RELEASE" ] && [ "$BASE" != "$RELEASE" ]; then
            echo "::warning::Track B .deb was built on Ubuntu $BASE, so Ubuntu $RELEASE is BELOW its build base and is NOT verified. The shipped plug-in does not install there."
            exit 0
          fi
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.release }}" \
            ./scripts/verify_deb_install_linux.sh trackb-deb/*.deb runtime-deb/*.deb

  # Single stable required context for the whole Linux packaging lane —
  # "Linux Packaging" (mirrors displayxr-runtime's, PR #1684).
  #
  # Why an aggregator rather than requiring the legs directly: DebInstall is a
  # matrix, so its contexts are "DebInstall (Ubuntu 22.04)", "… 24.04",
  # "… 26.04" — names that change the moment a release is added or dropped, and
  # a ruleset still demanding a context no job produces blocks every PR forever.
  # This job's name is fixed, so the matrix can grow or shrink freely.
  #
  # The gap it closes: DebInstall proves the Track A (stub) .deb — and the
  # Track B .deb whenever it was built — installs AND runs on every supported
  # release, but nothing stopped a PR MERGING with it red — the
  # runtime #1656 shape (a .deb that apt installs on 22.04 and that then fails
  # at exec / dlopen) was only caught at release time, if at all.
  #
  # Doc-only PRs: DebStub / Deb / DebInstall still RUN on the docs_only path and skip
  # every step, so this job's needs are satisfied and it reports success in
  # seconds without asserting anything.
  #
  # `if: always()` is load-bearing: without it a failed leg would SKIP this job,
  # and a skipped check counts as green for a required context — the aggregator
  # would silently stop gating exactly when it matters.
  LinuxPackaging:
    name: Linux Packaging
    needs: [DetectChanges, DebStub, Deb, DebInstall]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — packaging legs short-circuited; reporting success without asserting."

      - name: Assert every packaging leg succeeded
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          # DetectChanges is included on purpose: if it failed, docs_only is ''
          # (!= 'true'), so we land here — and must fail rather than green-light
          # a run whose change classification never happened.
          RESULT_DETECTCHANGES: ${{ needs.DetectChanges.result }}
          RESULT_DEBSTUB: ${{ needs.DebStub.result }}
          # Track B soft-skips its build steps (with a ::warning::) when the
          # vendor token or Linux SDK asset is absent — fork PRs included — and
          # still ends 'success', so requiring it cannot deadlock a fork PR.
          RESULT_DEB: ${{ needs.Deb.result }}
          # Matrix job: 'success' only when every leg succeeded (fail-fast is
          # off, so one red release still surfaces here).
          RESULT_DEBINSTALL: ${{ needs.DebInstall.result }}
        run: |
          set -u
          rc=0
          for leg in DETECTCHANGES DEBSTUB DEB DEBINSTALL; do
            var="RESULT_${leg}"
            result="${!var}"
            printf '%-14s %s\n' "$leg" "${result:-<missing>}"
            # Anything that is not an outright success fails the gate —
            # including 'skipped', which on the non-docs_only path can only
            # mean a leg was bypassed by a condition it should not have been.
            [ "$result" = "success" ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Linux packaging lane is not green — see the leg results above."
            exit 1
          fi
          echo "All Linux packaging legs succeeded."

  # Attach the Track B .deb to the GitHub Release on a v* tag — only once
  # DebInstall has proved it on every release it claims to support.
  DebRelease:
    needs: [Deb, DebInstall]
    if: needs.Deb.outputs.have_sdk == 'yes' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: displayxr-leia-sr-deb
          path: dist

      - name: Attach .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/displayxr-leia-sr_*_amd64.deb
          fail_on_unmatched_files: true
