name: lint

# Fast, secret-free checks that run on every PR and every push to main.
#
# - SR pin guard: the SR SDK tags this repo's Windows arm fetches at build time
#   are declared TWICE by hand -- `set SR_TAG=...` etc. in
#   scripts/build-windows.bat (what a developer runs) and the matching
#   `SR_TAG: ...` keys in build-windows.yml's jobs.Build.env (what CI runs).
#   Nothing but a "KEEP IN SYNC" comment held them together, and a
#   half-applied repin is silent: both sides compile clean against different
#   SDKs. It also checks SR_V2_TAG and SR_V2_DIR still name the same build,
#   which is the pair a repin is most likely to split. See
#   scripts/check_sr_pins.py.
#
# Pure file reads -- no network, no token, no SDK,
# no build. Add other lightweight lint jobs here as needed.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  PinSync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: SR SDK pins agree between build-windows.bat and CI
        run: python3 scripts/check_sr_pins.py

  # macOS .pkg scripts (installer/macos): the runtime-floor gate in preinstall,
  # the restart-only-if-running rule in postinstall and the uninstaller, run
  # against a fake root with fake pkgutil / launchctl / stat / id. Pure bash,
  # so it runs here; the .pkg ITSELF cannot be built in CI (no LeiaSR macOS
  # SDK in any CI-reachable release -- see docs/installer.md, macOS section).
  MacPkgScripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in installer/macos/build_pkg.sh installer/macos/uninstall.sh \
                   installer/macos/test_pkg_scripts.sh installer/macos/scripts/preinstall \
                   installer/macos/scripts/postinstall scripts/build-macos.sh \
                   scripts/macos_sign_notarize.sh; do
            bash -n "$f"
          done

      - name: pre/postinstall + uninstall dry run
        run: bash installer/macos/test_pkg_scripts.sh
